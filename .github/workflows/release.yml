name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# A permissions block replaces the defaults rather than merging with them, so
# contents: write must stay listed or the release upload fails with a 403.
permissions:
  contents: write
  id-token: write      # OIDC token used to sign the attestation
  attestations: write

jobs:
  build:
    name: build arm64 macOS binary
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: swift version
        run: swift --version

      - name: cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: test
        run: |
          swift test -c release
          python3 Tests/install_test.py

      - name: build
        run: sh scripts/build.sh

      - name: smoke test packaged executable
        run: dist/parrot --help

      - name: strip and sign
        run: |
          strip -x dist/parrot
          codesign --force --sign - dist/parrot
          codesign --verify --strict dist/parrot

      - name: package
        run: |
          cd dist
          tar -czf parrot-macos-arm64.tar.gz parrot mlx.metallib
          shasum -a 256 parrot-macos-arm64.tar.gz > parrot-macos-arm64.tar.gz.sha256
          ls -lh

      # Attests the file's digest, so it must run on the final bytes: after
      # packaging, before upload.
      - name: attest build provenance
        uses: actions/attest-build-provenance@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: dist/parrot-macos-arm64.tar.gz

      - name: release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/parrot-macos-arm64.tar.gz
            dist/parrot-macos-arm64.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
